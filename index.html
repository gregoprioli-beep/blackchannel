<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>BLACK CHANNEL</title>

<meta name="theme-color" content="#050505">
<meta name="background-color" content="#050505">
<meta name="description" content="BLACK CHANNEL - Unofficial Communication Network">

<link rel="manifest" href="./manifest.json">

<style>
:root {
    --bg: #050505;
    --panel: #090909;
    --panel2: #0d0d0d;
    --green: #00ff66;
    --green2: #00b84a;
    --dim: #4c7a5c;
    --text: #b8ffc9;
    --red: #ff3b3b;
    --yellow: #ffd000;
    --border: #123d21;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", monospace;
    overflow: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        to bottom,
        rgba(0,255,100,0.025) 0px,
        rgba(0,255,100,0.025) 1px,
        transparent 1px,
        transparent 4px
    );
    z-index: 999;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

#app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

/* HEADER */

header {
    height: 74px;
    min-height: 74px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: #030303;
}

.brand {
    display: flex;
    flex-direction: column;
}

.brand-title {
    color: var(--green);
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 3px;
}

.brand-subtitle {
    color: var(--dim);
    font-size: 10px;
    margin-top: 3px;
    letter-spacing: 1px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.status {
    font-size: 11px;
    color: var(--green);
}

.status::before {
    content: "●";
    margin-right: 5px;
}

.install-btn {
    display: none;
    background: transparent;
    border: 1px solid var(--green);
    color: var(--green);
    padding: 7px 10px;
    font-size: 11px;
}

/* MAIN */

.main {
    flex: 1;
    min-height: 0;
    display: flex;
}

/* SIDEBAR */

.sidebar {
    width: 245px;
    min-width: 245px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
}

.identity {
    padding: 15px;
    border-bottom: 1px solid var(--border);
}

.identity-label {
    color: var(--dim);
    font-size: 9px;
    margin-bottom: 4px;
}

.identity-value {
    color: var(--green);
    font-size: 12px;
    margin-bottom: 11px;
    word-break: break-all;
}

.channels-title {
    padding: 14px 15px 8px;
    color: var(--dim);
    font-size: 9px;
    letter-spacing: 1px;
}

.channels {
    padding: 0 9px;
}

.channel {
    width: 100%;
    background: transparent;
    color: #699b78;
    border: 1px solid transparent;
    text-align: left;
    padding: 10px;
    margin-bottom: 4px;
    font-size: 12px;
}

.channel:hover {
    color: var(--green);
    border-color: var(--border);
}

.channel.active {
    color: var(--green);
    border-color: var(--green2);
    background: rgba(0,255,100,0.04);
}

.node-box {
    margin-top: auto;
    padding: 12px 15px;
    border-top: 1px solid var(--border);
    font-size: 9px;
    color: var(--dim);
    line-height: 1.7;
}

/* CHAT */

.chat {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.chat-header {
    height: 48px;
    min-height: 48px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    background: var(--panel2);
}

.channel-name {
    color: var(--green);
    font-size: 13px;
}

.channel-state {
    color: var(--dim);
    font-size: 9px;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.message {
    margin-bottom: 13px;
    max-width: 850px;
}

.message-meta {
    font-size: 9px;
    color: var(--dim);
    margin-bottom: 3px;
}

.message-text {
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
    word-wrap: break-word;
}

.system {
    color: var(--dim);
    font-size: 10px;
    margin: 8px 0;
}

/* COMPOSER */

.composer {
    border-top: 1px solid var(--border);
    padding: 10px;
    background: #030303;
}

.composer-main {
    display: flex;
    gap: 7px;
}

#messageInput {
    flex: 1;
    min-width: 0;
    background: #080808;
    color: var(--text);
    border: 1px solid var(--border);
    outline: none;
    padding: 12px;
    font-size: 13px;
}

#messageInput:focus {
    border-color: var(--green2);
}

.action-btn,
.send-btn {
    border: 1px solid var(--border);
    background: #080808;
    color: var(--green);
    min-width: 44px;
    padding: 0 11px;
    font-size: 17px;
}

.action-btn:hover,
.send-btn:hover {
    border-color: var(--green);
}

.send-btn {
    font-size: 12px;
    font-weight: bold;
}

.composer-tools {
    display: flex;
    gap: 6px;
    margin-top: 7px;
}

.tool {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
    padding: 6px 9px;
    font-size: 10px;
}

.tool:hover {
    color: var(--green);
    border-color: var(--green2);
}

/* FILE */

.file-card {
    display: inline-flex;
    flex-direction: column;
    gap: 5px;
    border: 1px solid var(--border);
    padding: 9px;
    margin-top: 5px;
    min-width: 200px;
}

.file-name {
    color: var(--green);
    font-size: 11px;
}

.file-size {
    color: var(--dim);
    font-size: 9px;
}

.file-open {
    color: var(--text);
    background: transparent;
    border: 1px solid var(--border);
    padding: 5px 7px;
    font-size: 9px;
}

/* AUDIO */

.audio-card {
    margin-top: 5px;
    border: 1px solid var(--border);
    padding: 8px;
    max-width: 360px;
}

.audio-card audio {
    width: 100%;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(700px, 92vw);
    background: #070707;
    border: 1px solid var(--green2);
    padding: 15px;
}

.modal-title {
    color: var(--green);
    margin-bottom: 12px;
    font-size: 13px;
}

.call-layout {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

#remoteVideo,
#localVideo {
    width: 100%;
    background: #000;
    border: 1px solid var(--border);
    max-height: 380px;
    object-fit: cover;
}

#localVideo {
    max-height: 160px;
}

.call-buttons {
    display: flex;
    gap: 7px;
}

.call-buttons button {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--border);
    background: #080808;
    color: var(--green);
}

.call-buttons .danger {
    color: var(--red);
}

/* MOBILE */

@media (max-width: 720px) {

    header {
        height: 65px;
        min-height: 65px;
        padding: 0 10px;
    }

    .brand-title {
        font-size: 17px;
    }

    .brand-subtitle {
        font-size: 8px;
    }

    .sidebar {
        width: 125px;
        min-width: 125px;
    }

    .identity {
        padding: 10px;
    }

    .channels-title {
        padding-left: 10px;
    }

    .channel {
        font-size: 10px;
        padding: 8px;
    }

    .node-box {
        padding: 8px;
        font-size: 8px;
    }

    .messages {
        padding: 10px;
    }

    .message-text {
        font-size: 12px;
    }

    .composer-tools {
        overflow-x: auto;
    }

    .tool {
        white-space: nowrap;
    }

    .status {
        display: none;
    }
}
</style>
</head>

<body>

<div id="app">

<header>
    <div class="brand">
        <div class="brand-title">BLACK CHANNEL</div>
        <div class="brand-subtitle">UNOFFICIAL COMMUNICATION NETWORK</div>
    </div>

    <div class="header-right">
        <button id="installBtn" class="install-btn">INSTALL PWA</button>
        <div id="status" class="status">CONNECTING</div>
    </div>
</header>

<div class="main">

    <aside class="sidebar">

        <div class="identity">

            <div class="identity-label">CODENAME</div>
            <div id="codename" class="identity-value">---</div>

            <div class="identity-label">NODE ID</div>
            <div id="nodeId" class="identity-value">---</div>

        </div>

        <div class="channels-title">CHANNELS</div>

        <div class="channels">

            <button class="channel active" data-channel="BLACK-01">
                BLACK-01
            </button>

            <button class="channel" data-channel="BLACK-02">
                BLACK-02
            </button>

            <button class="channel" data-channel="OPERATIONS">

            </button>

            </button>

        </div>

            <br><br>

    </aside>

    <section class="chat">

            </div>

                >📎</button>

                >SEND</button>

    </section>

</div>

</div>

<!-- CALL MODAL -->

<div id="callModal" class="modal">

    <div class="modal-box">

        <div id="callTitle" class="modal-title">
            COMMUNICATION SESSION
        </div>

        <div class="call-layout">

            <video
                id="remoteVideo"
                autoplay
                playsinline
            ></video>

            <video
                id="localVideo"
                autoplay
                muted
                playsinline
            ></video>

            <audio
                id="remoteAudio"
                autoplay
            ></audio>

            <div class="call-buttons">

                <button id="endCallBtn" class="danger">
                    END SESSION
                </button>

            </div>

        </div>

    </div>

</div>

<script type="module">

/* =========================================================
   FIREBASE
   ========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    push,
    onValue,
    serverTimestamp,
    set
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

    apiKey: "AIzaSyASwmaByRPWbJtNEjI7wIhn4c6QgeQryqg",

    authDomain: "black-channel-aba6d.firebaseapp.com",

    projectId: "black-channel-aba6d",

    storageBucket: "black-channel-aba6d.firebasestorage.app",

    messagingSenderId: "1062171583348",

    appId: "1:1062171583348:web:1b69a2567dfa28522bc221",

    databaseURL:
        "https://black-channel-aba6d-default-rtdb.firebaseio.com"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


/* =========================================================
   LOCAL IDENTITY
   ========================================================= */

const prefixes = [
    "NIGHT",
    "BLACK",
    "SHADOW",
    "GHOST",
    "RAVEN",
    "VECTOR",
    "ECHO",
    "PHANTOM",
    "SILENT",
    "DARK",
    "FALCON",
    "VIPER"
];

const suffixes = [
    "FALCON",
    "WOLF",
    "HAWK",
    "ORBIT",
    "ZERO",
    "NEXUS",
    "SPECTER",
    "TIGER",
    "FOX",
    "RIDER",
    "MATRIX",
    "GHOST"
];


function randomItem(array) {
    return array[
        Math.floor(Math.random() * array.length)
    ];
}


function randomHex(length) {

    const chars = "0123456789ABCDEF";

    let result = "";

    for (let i = 0; i < length; i++) {

        result += chars[
            Math.floor(Math.random() * chars.length)
        ];

    }

    return result;
}


let codename =
    localStorage.getItem("blackChannelCodename");

if (!codename) {

    codename =
        randomItem(prefixes) +
        "-" +
        randomItem(suffixes);

    localStorage.setItem(
        "blackChannelCodename",
        codename
    );

}


let nodeId =
    localStorage.getItem("blackChannelNode");

if (!nodeId) {

    nodeId =
        randomHex(4) +
        "-" +
        randomHex(4);

    localStorage.setItem(
        "blackChannelNode",
        nodeId
    );

}


let sessionId =
    sessionStorage.getItem("blackChannelSession");

if (!sessionId) {

    sessionId = randomHex(8);

    sessionStorage.setItem(
        "blackChannelSession",
        sessionId
    );

}


document.getElementById("codename").textContent =
    codename;

document.getElementById("nodeId").textContent =
    nodeId;

document.getElementById("sessionId").textContent =
    sessionId;


/* =========================================================
   STATE
   ========================================================= */

let currentChannel = "BLACK-01";

let currentUser = null;

let unsubscribeMessages = null;

let deferredInstallPrompt = null;


/* =========================================================
   UI HELPERS
   ========================================================= */

const statusElement =
    document.getElementById("status");

const messagesElement =
    document.getElementById("messages");

const inputElement =
    document.getElementById("messageInput");


function setStatus(text) {

    statusElement.textContent = text;

}


function scrollMessages() {

    messagesElement.scrollTop =
        messagesElement.scrollHeight;

}


function clearMessages() {

    messagesElement.innerHTML = "";

}


function addSystemMessage(text) {

    const div =
        document.createElement("div");

    div.className = "system";

    div.textContent =
        "[SYSTEM] " + text;

    messagesElement.appendChild(div);

    scrollMessages();
}


/* =========================================================
   FIREBASE AUTH
   ========================================================= */

signInAnonymously(auth)
    .catch(error => {

        console.error(error);

        setStatus("AUTH ERROR");

        addSystemMessage(
            "Authentication failed."
        );

    });


onAuthStateChanged(auth, user => {

    if (!user) {
        return;
    }

    currentUser = user;

    setStatus("ONLINE");

    addSystemMessage(
        "Anonymous node authenticated."
    );

    listenToChannel(currentChannel);

});


/* =========================================================
   FIREBASE MESSAGES
   ========================================================= */

function listenToChannel(channel) {

    if (unsubscribeMessages) {

        unsubscribeMessages();

        unsubscribeMessages = null;

    }

    clearMessages();

    addSystemMessage(
        "Channel " + channel + " initialized."
    );


    const messagesRef =
        ref(
            db,
            "channels/" +
            channel +
            "/messages"
        );


    unsubscribeMessages =
        onValue(
            messagesRef,
            snapshot => {

                clearMessages();

                const data =
                    snapshot.val();

                if (!data) {

                    addSystemMessage(
                        "No messages in channel."
                    );

                    return;

                }


                Object.entries(data).forEach(
                    ([id, message]) => {

                        renderMessage(
                            id,
                            message
                        );

                    }
                );


                scrollMessages();

            },
            error => {

                console.error(error);

                addSystemMessage(
                    "Unable to read channel."
                );

            }
        );

}


/* =========================================================
   RENDER MESSAGE
   ========================================================= */

function renderMessage(id, message) {

    if (!message) {
        return;
    }


    const wrapper =
        document.createElement("div");

    wrapper.className = "message";


    const meta =
        document.createElement("div");

    meta.className = "message-meta";


    const timestamp =
        message.timestamp
            ? new Date(
                message.timestamp
              ).toLocaleTimeString(
                "pt-BR",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
              )
            : "--:--";


    meta.textContent =
        `${message.sender || "UNKNOWN"} // ${timestamp}`;


    wrapper.appendChild(meta);


    if (message.type === "text") {

        const text =
            document.createElement("div");

        text.className =
            "message-text";

        text.textContent =
            message.text || "";

        wrapper.appendChild(text);

    }


    if (message.type === "file") {

        const card =
            document.createElement("div");

        card.className =
            "file-card";


        const name =
            document.createElement("div");

        name.className =
            "file-name";

        name.textContent =
            "📎 " +
            (message.name || "FILE");


        const size =
            document.createElement("div");

        size.className =
            "file-size";

        size.textContent =
            "Arquivo disponível localmente";


        card.appendChild(name);

        card.appendChild(size);


        const info =
            document.createElement("div");

        info.className =
            "file-size";

        info.textContent =
            "O arquivo permanece armazenado neste dispositivo.";


        card.appendChild(info);

        wrapper.appendChild(card);

    }


    if (message.type === "audio") {

        const card =
            document.createElement("div");

        card.className =
            "audio-card";


        const info =
            document.createElement("div");

        info.className =
            "file-name";

        info.textContent =
            "🎙️ AUDIO MESSAGE";


        card.appendChild(info);

        wrapper.appendChild(card);

    }


    messagesElement.appendChild(wrapper);

}


/* =========================================================
   SEND TEXT
   ========================================================= */

async function sendText() {

    const text =
        inputElement.value.trim();

    if (!text) {
        return;
    }

    if (!currentUser) {

        addSystemMessage(
            "Authentication not ready."
        );

        return;

    }


    try {

        const messagesRef =
            ref(
                db,
                "channels/" +
                currentChannel +
                "/messages"
            );


        await push(
            messagesRef,
            {
                type: "text",

                text: text,

                sender: codename,

                node: nodeId,

                uid: currentUser.uid,

                timestamp:
                    serverTimestamp()
            }
        );


        inputElement.value = "";

    } catch (error) {

        console.error(error);

        addSystemMessage(
            "Falha ao enviar mensagem."
        );

    }

}


document
    .getElementById("sendBtn")
    .addEventListener(
        "click",
        sendText
    );


inputElement.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendText();

        }

    }
);


/* =========================================================
   CHANNELS
   ========================================================= */

document
    .querySelectorAll(".channel")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".channel")
                    .forEach(
                        b =>
                            b.classList.remove(
                                "active"
                            )
                    );


                button.classList.add("active");


                currentChannel =
                    button.dataset.channel;


                document
                    .getElementById(
                        "channelName"
                    )
                    .textContent =
                    currentChannel;


                if (currentUser) {

                    listenToChannel(
                        currentChannel
                    );

                }

            }
        );

    });


/* =========================================================
   INDEXED DB
   ========================================================= */

const DB_NAME =
    "BLACK_CHANNEL_LOCAL";

const DB_VERSION = 1;

const STORE_NAME =
    "files";


function openLocalDB() {

    return new Promise(
        (resolve, reject) => {

            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );


            request.onupgradeneeded =
                event => {

                    const database =
                        event.target.result;


                    if (
                        !database.objectStoreNames.contains(
                            STORE_NAME
                        )
                    ) {

                        database.createObjectStore(
                            STORE_NAME,
                            {
                                keyPath: "id",
                                autoIncrement: true
                            }
                        );

                    }

                };


            request.onsuccess =
                () => {

                    resolve(
                        request.result
                    );

                };


            request.onerror =
                () => {

                    reject(
                        request.error
                    );

                };

        }
    );

}


async function saveLocalFile(file) {

    const database =
        await openLocalDB();


    return new Promise(
        (resolve, reject) => {

            const transaction =
                database.transaction(
                    STORE_NAME,
                    "readwrite"
                );


            const store =
                transaction.objectStore(
                    STORE_NAME
                );


            const request =
                store.add({

                    name: file.name,

                    type: file.type,

                    size: file.size,

                    createdAt:
                        Date.now(),

                    blob: file

                });


            request.onsuccess =
                () => {

                    resolve(
                        request.result
                    );

                };


            request.onerror =
                () => {

                    reject(
                        request.error
                    );

                };

        }
    );

}


async function getLocalFiles() {

    const database =
        await openLocalDB();


    return new Promise(
        (resolve, reject) => {

            const transaction =
                database.transaction(
                    STORE_NAME,
                    "readonly"
                );


            const store =
                transaction.objectStore(
                    STORE_NAME
                );


            const request =
                store.getAll();


            request.onsuccess =
                () => {

                    resolve(
                        request.result
                    );

                };


            request.onerror =
                () => {

                    reject(
                        request.error
                    );

                };

        }
    );

}


async function getLocalFile(id) {

    const database =
        await openLocalDB();


    return new Promise(
        (resolve, reject) => {

            const transaction =
                database.transaction(
                    STORE_NAME,
                    "readonly"
                );


            const store =
                transaction.objectStore(
                    STORE_NAME
                );


            const request =
                store.get(id);


            request.onsuccess =
                () => {

                    resolve(
                        request.result
                    );

                };


            request.onerror =
                () => {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* =========================================================
   FILE ATTACHMENTS
   ========================================================= */

const fileInput =
    document.getElementById("fileInput");

const attachBtn =
    document.getElementById("attachBtn");


attachBtn.addEventListener(
    "click",
    () => {

        fileInput.click();

    }
);


fileInput.addEventListener(
    "change",
    async () => {

        const files =
            Array.from(
                fileInput.files
            );


        if (!files.length) {
            return;
        }


        for (const file of files) {

            try {

                const id =
                    await saveLocalFile(
                        file
                    );


                addSystemMessage(
                    `Arquivo armazenado localmente: ${file.name} [ID ${id}]`
                );


                if (currentUser) {

                    const messagesRef =
                        ref(
                            db,
                            "channels/" +
                            currentChannel +
                            "/messages"
                        );


                    await push(
                        messagesRef,
                        {

                            type: "file",

                            name: file.name,

                            mime: file.type,

                            size: file.size,

                            localId: id,

                            sender: codename,

                            node: nodeId,

                            uid:
                                currentUser.uid,

                            timestamp:
                                serverTimestamp()

                        }
                    );

                }

            } catch (error) {

                console.error(error);

                addSystemMessage(
                    "Falha ao armazenar arquivo."
                );

            }

        }


        fileInput.value = "";

    }
);

                if (!files.length) {

                    return;

                }


                files.forEach(

                        const meta =

                        const card =
                            document.createElement(
                                "div"
                            );

                        card.className =
                            "file-card";


                        const name =
                            document.createElement(
                                "div"
                            );

                        name.className =

                            file.name;


                        const size =

                        );

                        card.appendChild(size);

                        card.appendChild(open);


                        wrapper.appendChild(meta);

                        wrapper.appendChild(card);


                        messagesElement.appendChild(
                            wrapper
                        );

                    }
                );

                );

function formatBytes(bytes) {

    if (!bytes) {
        return "0 B";
    }

    const units = [
        "B",
        "KB",
        "MB",
        "GB"
    ];

    const index =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (
        (bytes /
            Math.pow(
                1024,
                index
            )
        ).toFixed(2) +
        " " +
        units[index]
    );

}


/* =========================================================
   AUDIO RECORDING
   ========================================================= */

let mediaRecorder = null;

let recordedChunks = [];

let recordingStream = null;


const recordBtn =
    document.getElementById(
        "recordBtn"
    );


recordBtn.addEventListener(
    "click",
    async () => {

        if (mediaRecorder &&
            mediaRecorder.state === "recording") {

            mediaRecorder.stop();

            recordBtn.textContent =
                "🎙️";

            return;

        }


        try {

            recordingStream =
                await navigator.mediaDevices.getUserMedia(
                    {
                        audio: true
                    }
                );


            recordedChunks = [];


            mediaRecorder =
                new MediaRecorder(
                    recordingStream
                );


            mediaRecorder.ondataavailable =
                event => {

                    if (event.data.size > 0) {

                        recordedChunks.push(
                            event.data
                        );

                    }

                };


            mediaRecorder.onstop =
                async () => {

                    const blob =
                        new Blob(
                            recordedChunks,
                            {
                                type:
                                    mediaRecorder.mimeType ||
                                    "audio/webm"
                            }
                        );


                    const file =
                        new File(
                            [
                                blob
                            ],
                            "audio-" +
                            Date.now() +
                            ".webm",
                            {
                                type:
                                    blob.type
                            }
                        );


                    try {

                        const id =
                            await saveLocalFile(
                                file
                            );


                        addSystemMessage(
                            `Áudio armazenado localmente. ID ${id}`
                        );


                        if (currentUser) {

                            await push(
                                ref(
                                    db,
                                    "channels/" +
                                    currentChannel +
                                    "/messages"
                                ),
                                {

                                    type:
                                        "audio",

                                    name:
                                        file.name,

                                    localId:
                                        id,

                                    sender:
                                        codename,

                                    node:
                                        nodeId,

                                    uid:
                                        currentUser.uid,

                                    timestamp:
                                        serverTimestamp()

                                }
                            );

                        }

                    } catch (error) {

                        console.error(error);

                    }


                    if (recordingStream) {

                        recordingStream
                            .getTracks()
                            .forEach(
                                track =>
                                    track.stop()
                            );

                    }

                };


            mediaRecorder.start();

            recordBtn.textContent =
                "⏹️";

            addSystemMessage(
                "Recording started..."
            );

        } catch (error) {

            console.error(error);

            addSystemMessage(
                "Microphone permission denied."
            );

        }

    }
);


/* =========================================================
   WEBRTC
   ========================================================= */

let peerConnection = null;

let localStream = null;

let currentCallMode = null;


const callModal =
    document.getElementById(
        "callModal"
    );

const localVideo =
    document.getElementById(
        "localVideo"
    );

const remoteVideo =
    document.getElementById(
        "remoteVideo"
    );

const remoteAudio =
    document.getElementById(
        "remoteAudio"
    );


const rtcConfig = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        }

    ]

};


function showCallModal(title) {

    document.getElementById(
        "callTitle"
    ).textContent = title;

    callModal.classList.add(
        "show"
    );

}


function closeCallModal() {

    callModal.classList.remove(
        "show"
    );

}


async function startCall(mode) {

    currentCallMode = mode;


    try {

        localStream =
            await navigator.mediaDevices.getUserMedia(
                {
                    audio: true,
                    video:
                        mode === "video"
                }
            );


        localVideo.srcObject =
            mode === "video"
                ? localStream
                : null;


        peerConnection =
            new RTCPeerConnection(
                rtcConfig
            );


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );

                }
            );


        peerConnection.ontrack =
            event => {

                if (
                    event.streams &&
                    event.streams[0]
                ) {

                    if (mode === "video") {

                        remoteVideo.srcObject =
                            event.streams[0];

                    } else {

                        remoteAudio.srcObject =
                            event.streams[0];

                    }

                }

            };


        peerConnection.onicecandidate =
            event => {

                if (
                    event.candidate &&
                    currentUser
                ) {

                    push(
                        ref(
                            db,
                            "calls/" +
                            currentUser.uid +
                            "/ice"
                        ),
                        event.candidate.toJSON()
                    );

                }

            };


        showCallModal(
            mode === "video"
                ? "VIDEO COMMUNICATION"
                : "AUDIO COMMUNICATION"
        );


        addSystemMessage(
            "WebRTC session initialized."
        );


    } catch (error) {

        console.error(error);

        addSystemMessage(
            "Unable to access microphone/camera."
        );

    }

}


document
    .getElementById("audioCallBtn")
    .addEventListener(
        "click",
        () => startCall("audio")
    );


document
    .getElementById("videoCallBtn")
    .addEventListener(
        "click",
        () => startCall("video")
    );


document
    .getElementById("endCallBtn")
    .addEventListener(
        "click",
        endCall
    );


function endCall() {

    if (peerConnection) {

        peerConnection.close();

        peerConnection = null;

    }


    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        localStream = null;

    }


    localVideo.srcObject =
        null;

    remoteVideo.srcObject =
        null;

    remoteAudio.srcObject =
        null;


    closeCallModal();

    addSystemMessage(
        "Communication session terminated."
    );

}

window.addEventListener(
    "beforeinstallprompt",
    event => {

        event.preventDefault();

        deferredInstallPrompt =
            event;


        const button =
            document.getElementById(
                "installBtn"
            );


        button.style.display =
            "block";

    }
);


document
    .getElementById("installBtn")
    .addEventListener(
        "click",
        async () => {

            if (!deferredInstallPrompt) {
                return;
            }


            deferredInstallPrompt.prompt();

            await deferredInstallPrompt.userChoice;

            deferredInstallPrompt =
                null;


            document
                .getElementById(
                    "installBtn"
                )
                .style.display =
                "none";

        }
    );
